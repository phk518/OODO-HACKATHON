<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traveloop — Join the Journey</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/gsap-3d.css" />
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--grad-hero);
      padding: var(--space-xl);
    }
    .auth-card {
      width: 100%;
      max-width: 500px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: var(--space-2xl);
      box-shadow: var(--shadow-lg);
    }
    .auth-header {
      text-align: center;
      margin-bottom: var(--space-2xl);
    }
    .auth-logo {
      font-size: 2.5rem;
      margin-bottom: var(--space-md);
      display: block;
    }
    .auth-title {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .auth-subtitle {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }
    .auth-tabs {
      display: flex;
      background: var(--bg-elevated);
      padding: 4px;
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-xl);
    }
    .auth-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s;
    }
    .auth-tab.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-md);
    }
    .form-group {
      margin-bottom: var(--space-md);
    }
    .form-group.full {
      grid-column: span 2;
    }
    .form-label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .auth-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--danger);
      padding: var(--space-md);
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      margin-bottom: var(--space-lg);
      display: none;
    }
  </style>
</head>
<body class="bg-base">
  <canvas id="particles-canvas"></canvas>

  <main class="auth-wrapper">
    <div class="auth-card animate-in">
      <div class="auth-header">
        <span class="auth-logo">✈️</span>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join thousands of travelers on Traveloop</p>
      </div>

      <div class="auth-tabs">
        <a href="login.html" class="auth-tab">Sign In</a>
        <div class="auth-tab active">Sign Up</div>
      </div>

      <div id="register-error" class="auth-error"></div>

      <form id="register-form" onsubmit="handleRegister(e)">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">First Name</label>
            <input type="text" id="first_name" class="form-input" placeholder="Alex" required />
          </div>
          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input type="text" id="last_name" class="form-input" placeholder="Smith" required />
          </div>
          <div class="form-group full">
            <label class="form-label">Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="alex@example.com" required />
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Min. 6 chars" minlength="6" required />
          </div>
          <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input type="password" id="confirm" class="form-input" placeholder="Re-enter" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:var(--space-md);">Create Account</button>
      </form>

      <div style="margin-top:var(--space-xl);text-align:center;font-size:0.8rem;color:var(--text-secondary);">
        Already have an account? <a href="login.html" style="color:var(--primary);font-weight:600;">Sign in</a>
      </div>
    </div>
  </main>

  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/gsap-3d.js"></script>
  <script>
    if (Session.get()) window.location.href = 'dashboard.html';

    function handleRegister(e) {
      if (e) e.preventDefault();
      const first = document.getElementById('first_name').value.trim();
      const last = document.getElementById('last_name').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const pass = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const errEl = document.getElementById('register-error');

      if (pass !== confirm) {
        errEl.textContent = 'Passwords do not match.';
        errEl.style.display = 'block';
        return;
      }

      try {
        const user = Users.create({ name: `${first} ${last}`, email, password: pass });
        Session.set(user);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      }
    }
    // Fix for the form onsubmit
    document.getElementById('register-form').onsubmit = handleRegister;
  </script>
</body>
</html>
