<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Traveloop — Explore Activities</title>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="stylesheet" href="css/components.css"/>
  <link rel="stylesheet" href="css/gsap-3d.css"/>
  <style>
    .explore-layout { display: grid; grid-template-columns: 280px 1fr; gap: var(--space-xl); align-items: start; }
    
    .sidebar-filter { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: var(--space-xl); position: sticky; top: calc(var(--navbar-h) + 20px); }
    .filter-group { margin-bottom: var(--space-xl); }
    .filter-title { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: var(--space-md); }
    
    .activity-card-wide { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden; display: flex; transition: all 0.2s; margin-bottom: var(--space-lg); }
    .activity-card-wide:hover { border-color: var(--border-primary); transform: translateY(-2px); }
    .activity-wide-img { width: 280px; height: 220px; object-fit: cover; flex-shrink: 0; }
    .activity-wide-content { padding: var(--space-xl); flex: 1; display: flex; flex-direction: column; }
    
    .activity-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
    
    .price-tag { font-size: 1.5rem; font-weight: 700; color: var(--text-primary); }
    
    @media (max-width: 992px) {
      .explore-layout { grid-template-columns: 1fr; }
      .sidebar-filter { position: static; margin-bottom: var(--space-xl); }
      .activity-card-wide { flex-direction: column; }
      .activity-wide-img { width: 100%; height: 200px; }
    }
  </style>
</head>
<body class="bg-dots">
  <div class="loading-screen"><div class="loading-logo">✈</div><div style="color:var(--text-secondary);font-size:0.9rem;">Traveloop</div><div class="loading-bar"><div class="loading-bar-fill"></div></div></div>
  <canvas id="particles-canvas"></canvas>
  <header id="main-navbar" class="navbar"></header>

  <main class="page-wrapper">
    <!-- Header -->
    <div class="flex-col gap-md mb-2xl animate-in">
      <div class="flex items-center gap-xs text-muted label-sm mb-xs">
        <span>Explore</span>
        <span class="material-symbols-outlined" style="font-size:14px;">chevron_right</span>
        <span class="text-primary font-bold" id="city-breadcrumb">Tokyo</span>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:flex-end; width:100%;">
        <div>
          <h1 class="page-title" id="explore-title">Discover Tokyo</h1>
          <p class="page-subtitle" id="explore-subtitle">248 experiences found for your adventure</p>
        </div>
        <div class="search-bar" style="width:300px;">
          <span class="material-symbols-outlined">search</span>
          <input type="text" id="city-search-input" placeholder="Search another city..." />
        </div>
      </div>
    </div>

    <div class="explore-layout">
      <!-- Sidebar Filters -->
      <aside class="sidebar-filter animate-in stagger-1">
        <div class="filter-group">
          <div class="filter-title">Categories</div>
          <div class="flex-col gap-sm">
            <label class="checkbox-group">
              <input type="checkbox" checked onchange="filterActivities()" data-cat="all">
              <span>All Categories</span>
            </label>
            <label class="checkbox-group">
              <input type="checkbox" onchange="filterActivities()" data-cat="sightseeing">
              <span>Tours & Sightseeing</span>
            </label>
            <label class="checkbox-group">
              <input type="checkbox" onchange="filterActivities()" data-cat="food">
              <span>Food & Drink</span>
            </label>
            <label class="checkbox-group">
              <input type="checkbox" onchange="filterActivities()" data-cat="adventure">
              <span>Outdoor & Adventure</span>
            </label>
            <label class="checkbox-group">
              <input type="checkbox" onchange="filterActivities()" data-cat="culture">
              <span>Art & Culture</span>
            </label>
          </div>
        </div>

        <div class="filter-group">
          <div class="filter-title">Price Range</div>
          <div style="padding:0 8px;">
            <input type="range" min="0" max="500" value="500" class="w-full" id="price-range" oninput="filterActivities()">
            <div class="flex justify-between label-sm mt-sm">
              <span>$0</span>
              <span id="price-val">$500+</span>
            </div>
          </div>
        </div>

        <div class="card mt-xl" style="padding:0; overflow:hidden; position:relative; height:180px;">
          <div style="position:absolute; inset:0; background:radial-gradient(circle at center, #1e293b, #0f172a); display:flex; align-items:center; justify-content:center; font-size:3rem;">🗺️</div>
          <div style="position:absolute; bottom:0; left:0; right:0; padding:12px; background:linear-gradient(to top, rgba(0,0,0,0.8), transparent);">
             <button class="btn btn-primary btn-full btn-sm">View on Map</button>
          </div>
        </div>
      </aside>

      <!-- Search Results -->
      <div id="activity-results" class="animate-in stagger-2">
        <!-- Dynamically populated -->
      </div>
    </div>
  </main>

  <div id="toast-container"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/sygic-api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    const user = Session.require();
    renderNavbar(user);

    let currentCity = 'tokyo';
    const CAT_BADGES = {
      sightseeing: { label: 'Tours', cls: 'badge-primary' },
      food:        { label: 'Food',  cls: 'badge-accent' },
      adventure:   { label: 'Outdoor', cls: 'badge-success' },
      culture:     { label: 'Culture', cls: 'badge-gold' },
      nature:      { label: 'Nature', cls: 'badge-success' },
    };

    const CAT_IMAGES = {
      sightseeing: 'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=600',
      food:        'https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=600',
      adventure:   'https://images.unsplash.com/photo-1524413840049-1d3c5a5ad4d2?auto=format&fit=crop&w=600',
      culture:     'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=600',
      nature:      'https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=600',
      default:     'https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=600'
    };

    async function loadActivities(cityId, cityName = null) {
      currentCity = cityId;
      const displayCity = cityName || (cityId.charAt(0).toUpperCase() + cityId.slice(1));
      
      document.getElementById('city-breadcrumb').textContent = displayCity;
      document.getElementById('explore-title').textContent = `Discover ${displayCity}`;
      
      const acts = await SygicAPI.getSygicActivities(cityId);
      document.getElementById('explore-subtitle').textContent = `${acts.length} real-world experiences found`;
      
      renderList(acts);
    }

    function renderList(acts) {
      const container = document.getElementById('activity-results');
      if (acts.length === 0) {
        container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🔎</div><div class="empty-state-title">No matches found</div><div class="empty-state-desc">Try adjusting your filters or search for another city.</div></div>`;
        return;
      }

      container.innerHTML = acts.map((a, i) => {
        const badge = CAT_BADGES[a.category] || { label: a.category, cls: 'badge-muted' };
        const img = CAT_IMAGES[a.category] || CAT_IMAGES.default;
        return `
          <div class="activity-card-wide animate-in" style="animation-delay: ${i * 50}ms">
            <img src="${img}" class="activity-wide-img" alt="${a.name}" />
            <div class="activity-wide-content">
              <div class="flex justify-between items-start mb-sm">
                <div class="flex items-center gap-sm">
                  <span class="badge ${badge.cls}">${badge.label}</span>
                  <span class="label-sm" style="color:var(--gold);">⭐ 4.9 (120+)</span>
                </div>
                <button class="btn btn-icon btn-ghost" onclick="showToast('Added to wishlist','info')">
                   <span class="material-symbols-outlined">favorite</span>
                </button>
              </div>
              <h3 class="h3" style="margin-bottom:8px;">${a.name}</h3>
              <p class="body-sm text-muted mb-lg" style="flex:1;">${a.description}</p>
              <div class="flex flex-wrap gap-md mb-xl">
                 <div class="flex items-center gap-xs body-xs text-muted"><span class="material-symbols-outlined" style="font-size:16px;">schedule</span> ${a.duration} min</div>
                 <div class="flex items-center gap-xs body-xs text-muted"><span class="material-symbols-outlined" style="font-size:16px;">location_on</span> ${currentCity.charAt(0).toUpperCase() + currentCity.slice(1)}</div>
                 <div class="flex items-center gap-xs body-xs text-muted"><span class="material-symbols-outlined" style="font-size:16px;">translate</span> English, Japanese</div>
              </div>
              <div class="flex justify-between items-center mt-auto">
                <div>
                  <div class="body-xs text-muted">From</div>
                  <div class="price-tag">${formatCurrency(a.avgCost || 45)} <span class="body-xs font-normal">/ person</span></div>
                </div>
                <button class="btn btn-primary" onclick="showToast('Redirecting to booking...','info')">Book Now</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function filterActivities() {
      const priceMax = +document.getElementById('price-range').value;
      document.getElementById('price-val').textContent = `$${priceMax === 500 ? '500+' : priceMax}`;
      
      const selectedCats = Array.from(document.querySelectorAll('.checkbox-group input:checked'))
        .map(i => i.dataset.cat);
      
      const allActs = await getActivitiesForCity(currentCity);
      let filtered = allActs.filter(a => (a.avgCost || 0) <= priceMax);
      
      if (!selectedCats.includes('all')) {
        filtered = filtered.filter(a => selectedCats.includes(a.category));
      }
      
      renderList(filtered);
    }

    document.getElementById('city-search-input').addEventListener('keypress', async (e) => {
      if (e.key === 'Enter') {
        const val = e.target.value.trim();
        if (val.length < 2) return;
        
        showToast(`Searching for ${val}...`, 'info');
        const cities = await SygicAPI.searchSygicCities(val);
        
        if (cities.length > 0) {
          const first = cities[0];
          loadActivities(first.id, first.name);
          e.target.value = '';
        } else {
          showToast("Destination not found. Try another city!", "warning");
        }
      }
    });

    loadActivities('city:1', 'Tokyo');
  </script>
  <script src="js/gsap-3d.js"></script>
</body>
</html>
