<!DOCTYPE html>

<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Traveloop - Modern Explorer</title>
<meta name="description" content="Discover hidden gems and curate your perfect itinerary with Traveloop's AI-driven explorer tool designed for the modern adventurer."/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

0.05em", fontWeight: "600"}], "body-lg": ["18px", {lineHeight: "1.6", fontWeight: "400"}], "display-lg": ["48px", {lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "700"}], "headline-lg-mobile": ["28px", {lineHeight: "1.2", fontWeight: "700"}], "headline-lg": ["32px", {lineHeight: "1.2", fontWeight: "700"}], "body-md": ["16px", {lineHeight: "1.6", fontWeight: "400"}], "headline-md": ["24px", {lineHeight: "1.3", fontWeight: "600"}]}}}};
</script>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  body {
    min-height: max(884px, 100dvh);
  }
</style>
</head>
<body class="bg-background text-on-background antialiased overflow-hidden">

<!-- Splash Screen Container -->
<main class="relative h-screen w-full flex flex-col justify-between overflow-hidden">

  <!-- Full-screen Hero Image with Vignette Overlay -->
  <div class="absolute inset-0 z-0">
    <img
      alt="Traveler overlooking mountain vista"
      class="w-full h-full object-cover"
      src="https://lh3.googleusercontent.com/aida-public/AB6AXuCEusJNsyZjgoGaIeoqQzfymDvo2pjc7-yYI3SwWvy5Iq1cINbMZIwLrK6XVjKkPf8Ss0a8VXuz63FR_urereCEszZepYWbKOwfvk7Nk4qjt31ndP804U0X7PIoub9mQKDXyi8p2Rj-Hc6Yo69TkJ7RiIha_LHCSCCG6TGDUD9HxBLuLyUJdVBT02nPygblxharkQkCd6SkQVIjIfAJIH4mRtMMr16AkqvEt8fTNVJ_eKkseQVh2xygyCDjuz9YSAA9WO9FbOmFCkY"
    />
    <!-- Glassmorphism & Gradient Overlay for readability -->
    <div class="absolute inset-0 bg-gradient-to-t from-on-secondary-fixed/90 via-on-secondary-fixed/20 to-transparent"></div>
  </div>

  <!-- Header Content (Logo) -->
  <header class="relative z-10 pt-margin-desktop px-margin-mobile md:px-margin-desktop flex justify-center md:justify-start">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-primary-container text-4xl">explore</span>
      <h1 class="font-display-lg text-headline-md md:text-display-lg text-on-tertiary tracking-tight">Traveloop</h1>
    </div>
  </header>

  <!-- Main Copy Section -->
  <section class="relative z-10 px-margin-mobile md:px-margin-desktop mb-auto mt-24 max-w-2xl">
    <div class="space-y-4">
      <h2 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-tertiary leading-tight">
        Personalized Travel Planning Made Easy
      </h2>
      <p class="font-body-lg text-body-md md:text-body-lg text-on-tertiary/80 max-w-lg">
        Discover hidden gems and curate your perfect itinerary with our AI-driven explorer tool designed for the modern adventurer.
      </p>
    </div>
  </section>

  <!-- Action Buttons (Bottom Section) -->
  <footer class="relative z-10 pb-16 px-margin-mobile md:px-margin-desktop w-full">
    <div class="flex flex-col md:flex-row gap-4 items-center justify-center md:justify-start w-full max-w-[1440px] mx-auto">

      <!-- Primary Action -->
      <button
        id="btn-get-started"
        class="w-full md:w-auto px-10 py-4 bg-primary-container text-on-primary-container font-label-md text-label-md rounded-xl shadow-[0px_4px_10px_rgba(255,140,0,0.3)] hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2"
      >
        Get Started
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>

      <!-- Secondary Action -->
      <button
        id="btn-log-in"
        class="w-full md:w-auto px-10 py-4 bg-on-tertiary/10 backdrop-blur-md border border-on-tertiary/20 text-on-tertiary font-label-md text-label-md rounded-xl hover:bg-on-tertiary/20 active:scale-95 transition-all flex items-center justify-center gap-2"
      >
        Log In
      </button>
    </div>

    <!-- Scroll Indicator -->
    <div class="hidden md:flex flex-col items-center gap-2 mt-12 opacity-60">
      <p class="font-label-md text-xs text-on-tertiary uppercase tracking-widest">Discover More</p>
      <div class="w-[1px] h-12 bg-gradient-to-b from-on-tertiary to-transparent"></div>
    </div>
  </footer>

</main>

<!-- Decorative Elements -->
<div class="fixed top-0 right-0 w-1/3 h-full bg-gradient-to-l from-on-secondary-fixed/5 to-transparent pointer-events-none"></div>

</body>
</html>
