<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Traveloop — Itinerary View</title>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="stylesheet" href="css/components.css"/>
  <link rel="stylesheet" href="css/gsap-3d.css"/>
  <style>
    .itinerary-hero { border-radius:var(--radius-xl); padding:var(--space-2xl); border:1px solid var(--border); background:var(--grad-hero); position:relative; overflow:hidden; margin-bottom:var(--space-xl); text-align:center; }
    .itinerary-hero::before { content:''; position:absolute; inset:0; background:radial-gradient(circle at 30% 50%,rgba(59,130,246,.15) 0%,transparent 60%); }
    .hero-inner { position:relative; z-index:1; }
    .hero-emoji { font-size:3.5rem; display:block; margin-bottom:var(--space-md); }
    .hero-trip-name { font-size:2rem; font-weight:700; font-family:var(--font-serif); }
    .hero-meta { display:flex; justify-content:center; gap:var(--space-xl); margin-top:var(--space-lg); }
    .hero-stat { text-align:center; }
    .hero-stat-val { font-size:1.5rem; font-weight:700; }
    .hero-stat-lab { font-size:.75rem; color:var(--text-secondary); }
    .hero-actions { display:flex; justify-content:center; gap:var(--space-md); margin-top:var(--space-lg); }

    .city-block { margin-bottom:var(--space-2xl); }
    .city-block-header { display:flex; align-items:center; gap:var(--space-md); padding:var(--space-lg) var(--space-xl); background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-xl) var(--radius-xl) 0 0; border-bottom:none; }
    .city-order-badge { width:36px; height:36px; border-radius:50%; background:var(--grad-primary); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.9rem; flex-shrink:0; }
    .city-emoji { font-size:2rem; }
    .city-name { font-size:1.1rem; font-weight:700; }
    .city-dates { font-size:.8rem; color:var(--text-secondary); }

    .activities-list { background:var(--bg-card); border:1px solid var(--border); border-radius:0 0 var(--radius-xl) var(--radius-xl); padding:var(--space-md); display:flex; flex-direction:column; gap:8px; }
    .act-row { display:flex; align-items:center; gap:var(--space-md); padding:var(--space-md); background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-md); }
    .act-row-icon { width:42px; height:42px; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center; font-size:1.2rem; flex-shrink:0; background:var(--bg-surface); }
    .act-row-body { flex:1; }
    .act-row-name { font-weight:600; font-size:.875rem; }
    .act-row-meta { font-size:.75rem; color:var(--text-secondary); margin-top:2px; }
    .act-row-cost { color:var(--gold); font-weight:700; font-size:.9rem; }

    .view-toggle { display:flex; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-lg); padding:3px; margin-bottom:var(--space-xl); width:fit-content; }
    .view-btn { padding:7px 18px; border-radius:var(--radius-md); font-size:.8rem; font-weight:600; color:var(--text-secondary); cursor:pointer; transition:all .2s; }
    .view-btn.active { background:var(--bg-surface); color:var(--text-primary); box-shadow:var(--shadow-sm); }

    .calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
    .cal-header { text-align:center; font-size:.7rem; font-weight:700; color:var(--text-muted); padding:4px; text-transform:uppercase; }
    .cal-day { background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-sm); padding:6px; min-height:80px; }
    .cal-day.trip-day { border-color:var(--border-primary); background:var(--primary-dim); }
    .cal-day.today { border-color:var(--accent); }
    .cal-day-num { font-size:.75rem; font-weight:700; margin-bottom:4px; }
    .cal-act { font-size:.65rem; background:rgba(59,130,246,.2); border-radius:3px; padding:2px 4px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .no-acts { padding:var(--space-xl); text-align:center; color:var(--text-muted); font-size:.875rem; }
  </style>
</head>
<body class="bg-dots">
<div class="loading-screen"><div class="loading-logo">✈</div><div style="color:var(--text-secondary);font-size:0.9rem;">Traveloop</div><div class="loading-bar"><div class="loading-bar-fill"></div></div></div>
<canvas id="particles-canvas"></canvas>
<header id="main-navbar" class="navbar"></header>
<main class="page-wrapper">

  <div class="page-header animate-in" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-md);">
    <a id="edit-link" href="#" class="btn btn-ghost btn-sm">← Edit Itinerary</a>
    <div style="display:flex;gap:var(--space-sm);">
      <a id="budget-link" href="#" class="btn btn-outline-primary btn-sm">💰 Budget</a>
      <a id="share-link"  href="#" class="btn btn-accent btn-sm">🔗 Share</a>
    </div>
  </div>

  <!-- Hero -->
  <div class="itinerary-hero animate-in">
    <div class="hero-inner">
      <span class="hero-emoji" id="hero-emoji">✈️</span>
      <div class="hero-trip-name" id="hero-name"></div>
      <div style="color:var(--text-secondary);margin-top:4px;font-size:.9rem;" id="hero-desc"></div>
      <div class="hero-meta">
        <div class="hero-stat"><div class="hero-stat-val" id="h-dates"></div><div class="hero-stat-lab">Dates</div></div>
        <div class="hero-stat"><div class="hero-stat-val" id="h-days"></div><div class="hero-stat-lab">Days</div></div>
        <div class="hero-stat"><div class="hero-stat-val" id="h-cities"></div><div class="hero-stat-lab">Cities</div></div>
        <div class="hero-stat"><div class="hero-stat-val" id="h-activities"></div><div class="hero-stat-lab">Activities</div></div>
        <div class="hero-stat"><div class="hero-stat-val" id="h-cost"></div><div class="hero-stat-lab">Est. Cost</div></div>
      </div>
    </div>
  </div>

  <!-- View Toggle -->
  <div class="view-toggle animate-in stagger-1">
    <button class="view-btn active" onclick="setView('timeline',this)">📋 Timeline</button>
    <button class="view-btn" onclick="setView('list',this)">📄 List</button>
  </div>

  <!-- Timeline View -->
  <div id="timeline-view" class="animate-in stagger-2"></div>

  <!-- List View -->
  <div id="list-view" style="display:none;" class="animate-in"></div>

</main>

<div id="toast-container"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script src="js/activities-data.js"></script>
<script>
const user = Session.require();
renderNavbar(user);

const tripId = getParam('trip');
if (!tripId) window.location.href = 'trips.html';
const trip = Trips.find(tripId);
if (!trip) window.location.href = 'trips.html';

document.getElementById('edit-link').href   = `itinerary.html?trip=${tripId}`;
document.getElementById('budget-link').href = `budget.html?trip=${tripId}`;
document.getElementById('share-link').href  = `share.html?trip=${tripId}`;

function catInfo(id) {
  const CATS=[{id:'sightseeing',label:'Sightseeing',emoji:'🏛️'},{id:'food',label:'Food',emoji:'🍽️'},{id:'culture',label:'Culture',emoji:'🎨'},{id:'adventure',label:'Adventure',emoji:'🏔️'},{id:'shopping',label:'Shopping',emoji:'🛍️'},{id:'nature',label:'Nature',emoji:'🌿'},{id:'nightlife',label:'Nightlife',emoji:'🎶'},{id:'wellness',label:'Wellness',emoji:'🧘'}];
  return CATS.find(c=>c.id===id)||{label:id,emoji:'⭐'};
}

function load() {
  const stops = Stops.forTrip(tripId);
  let totalActs = 0, totalCost = 0;
  stops.forEach(s => {
    const a = Activities.forStop(s.id);
    totalActs += a.length;
    a.forEach(x => totalCost += x.cost||0);
  });

  document.getElementById('hero-emoji').textContent = trip.coverEmoji||'✈️';
  document.getElementById('hero-name').textContent  = trip.name;
  document.getElementById('hero-desc').textContent  = trip.description||'';
  document.getElementById('h-dates').textContent    = `${formatDate(trip.startDate,{month:'short',day:'numeric'})} – ${formatDate(trip.endDate,{month:'short',day:'numeric',year:'numeric'})}`;
  document.getElementById('h-days').textContent     = daysBetween(trip.startDate,trip.endDate);
  document.getElementById('h-cities').textContent   = stops.length;
  document.getElementById('h-activities').textContent = totalActs;
  document.getElementById('h-cost').textContent     = formatCurrency(totalCost);

  // Timeline
  const tv = document.getElementById('timeline-view');
  if (!stops.length) {
    tv.innerHTML='<div class="empty-state"><div class="empty-state-icon">🗺️</div><div class="empty-state-title">No stops yet</div><div class="empty-state-desc">Go back to the itinerary builder and add some cities!</div><a href="itinerary.html?trip='+tripId+'" class="btn btn-primary mt-md">Build Itinerary</a></div>';
    return;
  }

  tv.innerHTML = stops.map((stop, i) => {
    const acts = Activities.forStop(stop.id);
    const stopCost = acts.reduce((a,b)=>a+(b.cost||0),0);
    return `
      <div class="city-block animate-in" style="animation-delay:${i*60}ms;">
        <div class="city-block-header">
          <div class="city-order-badge">${i+1}</div>
          <span class="city-emoji">${stop.emoji||'📍'}</span>
          <div style="flex:1;">
            <div class="city-name">${stop.cityName}, ${stop.country}</div>
            <div class="city-dates">${formatDate(stop.arrivalDate,{month:'long',day:'numeric'})} — ${formatDate(stop.departureDate,{month:'long',day:'numeric',year:'numeric'})} · ${daysBetween(stop.arrivalDate,stop.departureDate)} days</div>
          </div>
          <div style="text-align:right;">
            <span class="badge badge-gold">${formatCurrency(stopCost)}</span>
            <div style="font-size:.72rem;color:var(--text-muted);margin-top:4px;">${acts.length} activities</div>
          </div>
        </div>
        <div class="activities-list">
          ${acts.length ? acts.map(a=>`
            <div class="act-row">
              <div class="act-row-icon">${a.emoji||catInfo(a.category).emoji}</div>
              <div class="act-row-body">
                <div class="act-row-name">${a.name}</div>
                <div class="act-row-meta">${catInfo(a.category).label} · ${a.duration} min</div>
              </div>
              <div class="act-row-cost">${formatCurrency(a.cost)}</div>
            </div>`).join('')
          : '<div class="no-acts">No activities — <a href="itinerary.html?trip='+tripId+'" style="color:var(--primary)">add some in the builder</a></div>'}
        </div>
      </div>`;
  }).join('');

  // List view
  const lv = document.getElementById('list-view');
  lv.innerHTML = `
    <div class="card">
      <table style="width:100%;border-collapse:collapse;">
        <thead>
          <tr style="border-bottom:1px solid var(--border);">
            <th style="text-align:left;padding:10px 12px;font-size:.75rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;">City</th>
            <th style="text-align:left;padding:10px 12px;font-size:.75rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;">Activity</th>
            <th style="text-align:left;padding:10px 12px;font-size:.75rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;">Category</th>
            <th style="text-align:right;padding:10px 12px;font-size:.75rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;">Cost</th>
          </tr>
        </thead>
        <tbody>
          ${stops.flatMap(stop => {
            const acts = Activities.forStop(stop.id);
            return acts.length
              ? acts.map((a,i)=>`
                  <tr style="border-bottom:1px solid var(--border);">
                    ${i===0?`<td style="padding:10px 12px;font-weight:600;font-size:.85rem;" rowspan="${acts.length}">${stop.emoji} ${stop.cityName}</td>`:''}
                    <td style="padding:10px 12px;font-size:.85rem;">${a.emoji||''} ${a.name}</td>
                    <td style="padding:10px 12px;"><span class="badge badge-muted">${catInfo(a.category).label}</span></td>
                    <td style="padding:10px 12px;text-align:right;color:var(--gold);font-weight:600;">${formatCurrency(a.cost)}</td>
                  </tr>`)
              : [`<tr style="border-bottom:1px solid var(--border);"><td style="padding:10px 12px;font-weight:600;font-size:.85rem;">${stop.emoji} ${stop.cityName}</td><td colspan="3" style="padding:10px 12px;color:var(--text-muted);font-size:.8rem;">No activities</td></tr>`];
          }).join('')}
          <tr style="background:var(--bg-elevated);">
            <td colspan="3" style="padding:10px 12px;font-weight:700;">Total</td>
            <td style="padding:10px 12px;text-align:right;font-weight:700;color:var(--gold);font-size:1rem;">${formatCurrency(totalCost)}</td>
          </tr>
        </tbody>
      </table>
    </div>`;
}

function setView(view, btn) {
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('timeline-view').style.display = view==='timeline' ? '' : 'none';
  document.getElementById('list-view').style.display     = view==='list' ? '' : 'none';
}

load();
</script>
<script src="js/gsap-3d.js"></script>
</body>
</html>
