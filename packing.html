<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Traveloop — Packing Checklist</title>
  <meta name="description" content="Manage your packing checklist — never forget essentials for your trip."/>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="stylesheet" href="css/components.css"/>
  <link rel="stylesheet" href="css/gsap-3d.css"/>
  <style>
    .packing-layout { display:grid; grid-template-columns:280px 1fr; gap:var(--space-xl); align-items:start; }
    .packing-sidebar { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-xl); padding:var(--space-xl); position:sticky; top:calc(var(--navbar-h)+20px); }
    .packing-progress { margin-top:var(--space-lg); }
    .packing-progress-text { display:flex; justify-content:space-between; font-size:.78rem; color:var(--text-secondary); margin-bottom:6px; }
    .cat-section { margin-bottom:var(--space-xl); }
    .cat-header { display:flex; align-items:center; gap:var(--space-sm); font-weight:700; font-size:1rem; margin-bottom:var(--space-md); padding-bottom:var(--space-sm); border-bottom:1px solid var(--border); }
    .cat-header-icon { width:32px; height:32px; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center; font-size:1rem; }
    .pack-item { display:flex; align-items:center; gap:var(--space-md); padding:10px var(--space-md); background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:6px; transition:all .2s; cursor:pointer; }
    .pack-item:hover { border-color:var(--border-hover); background:var(--bg-elevated); }
    .pack-item.packed { opacity:.5; }
    .pack-item.packed .pack-name { text-decoration:line-through; }
    .pack-check { width:22px; height:22px; border-radius:6px; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .2s; }
    .pack-item.packed .pack-check { background:var(--success); border-color:var(--success); color:#fff; }
    .pack-name { flex:1; font-size:.875rem; font-weight:500; }
    .pack-cat-badge { font-size:.7rem; color:var(--text-muted); }
    .add-item-form { display:flex; gap:var(--space-sm); margin-bottom:var(--space-xl); }
    .add-item-form .form-input { flex:1; }
    .quick-add-tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:var(--space-xl); }
    .quick-tag { padding:5px 12px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-full); font-size:.75rem; cursor:pointer; transition:all .2s; color:var(--text-secondary); }
    .quick-tag:hover { border-color:var(--border-primary); color:var(--primary); background:var(--primary-dim); }
  </style>
</head>
<body class="bg-dots">
<div class="loading-screen"><div class="loading-logo">✈</div><div style="color:var(--text-secondary);font-size:0.9rem;">Traveloop</div><div class="loading-bar"><div class="loading-bar-fill"></div></div></div>
<canvas id="particles-canvas"></canvas>
<header id="main-navbar" class="navbar"></header>
<main class="page-wrapper">

  <div class="page-header animate-in" style="display:flex;align-items:center;justify-content:space-between;">
    <div>
      <div style="margin-bottom:4px;"><a id="back-link" href="itinerary.html" class="btn btn-ghost btn-sm">← Back to Itinerary</a></div>
      <h1 class="page-title">🧳 Packing Checklist</h1>
      <p class="page-subtitle" id="trip-name-sub"></p>
    </div>
    <div style="display:flex;gap:var(--space-sm);">
      <button class="btn btn-ghost btn-sm" onclick="resetChecklist()">↩️ Reset All</button>
      <button class="btn btn-accent btn-sm" onclick="addSuggestedItems()">✨ Add Essentials</button>
    </div>
  </div>

  <!-- Add Item -->
  <div class="add-item-form animate-in stagger-1">
    <input type="text" id="new-item" class="form-input" placeholder="Add a packing item..." onkeypress="if(event.key==='Enter')addItem()"/>
    <select id="new-cat" class="form-select" style="width:160px;">
      <option value="clothing">👕 Clothing</option>
      <option value="documents">📄 Documents</option>
      <option value="electronics">🔌 Electronics</option>
      <option value="toiletries">🧴 Toiletries</option>
      <option value="accessories">🎒 Accessories</option>
      <option value="general">📦 General</option>
    </select>
    <button class="btn btn-primary" onclick="addItem()">+ Add</button>
  </div>

  <!-- Quick Add -->
  <div class="quick-add-tags animate-in stagger-1" id="quick-tags"></div>

  <div class="packing-layout animate-in stagger-2">
    <!-- Sidebar -->
    <div class="packing-sidebar">
      <div style="font-size:3rem;text-align:center;margin-bottom:var(--space-md);">🧳</div>
      <div style="text-align:center;font-weight:700;font-size:1.1rem;" id="sidebar-trip">Trip Name</div>
      <div style="text-align:center;color:var(--text-secondary);font-size:.8rem;margin-top:4px;" id="sidebar-dates"></div>
      <div class="packing-progress">
        <div class="packing-progress-text">
          <span>Packed</span>
          <span id="progress-label">0 / 0</span>
        </div>
        <div class="progress-bar-wrap" style="height:8px;">
          <div class="progress-bar-fill" id="progress-bar" style="width:0%;"></div>
        </div>
      </div>
      <hr class="divider"/>
      <div style="display:flex;flex-direction:column;gap:6px;" id="cat-summary"></div>
    </div>

    <!-- Items -->
    <div id="items-container"></div>
  </div>

</main>

<div id="toast-container"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script>
const user = Session.require();
renderNavbar(user);
const tripId = getParam('trip');
if (!tripId) window.location.href = 'trips.html';
const trip = Trips.find(tripId);
if (!trip) window.location.href = 'trips.html';

document.getElementById('back-link').href = `itinerary.html?trip=${tripId}`;
document.getElementById('trip-name-sub').textContent = trip.name;
document.getElementById('sidebar-trip').textContent = trip.name;
document.getElementById('sidebar-dates').textContent = `${formatDate(trip.startDate,{month:'short',day:'numeric'})} — ${formatDate(trip.endDate,{month:'short',day:'numeric',year:'numeric'})}`;

const CAT_INFO = {
  clothing:    { label:'Clothing',    emoji:'👕', color:'#3B82F6' },
  documents:   { label:'Documents',   emoji:'📄', color:'#F59E0B' },
  electronics: { label:'Electronics', emoji:'🔌', color:'#8B5CF6' },
  toiletries:  { label:'Toiletries',  emoji:'🧴', color:'#10B981' },
  accessories: { label:'Accessories', emoji:'🎒', color:'#EC4899' },
  general:     { label:'General',     emoji:'📦', color:'#94A3B8' },
};

const ESSENTIALS = [
  { name:'Passport', cat:'documents' },
  { name:'Travel Insurance Docs', cat:'documents' },
  { name:'Phone Charger', cat:'electronics' },
  { name:'Adapter/Converter', cat:'electronics' },
  { name:'Toothbrush & Toothpaste', cat:'toiletries' },
  { name:'Sunscreen', cat:'toiletries' },
  { name:'T-Shirts', cat:'clothing' },
  { name:'Underwear', cat:'clothing' },
  { name:'Comfortable Shoes', cat:'clothing' },
  { name:'Rain Jacket', cat:'clothing' },
  { name:'Power Bank', cat:'electronics' },
  { name:'Headphones', cat:'electronics' },
  { name:'Day Backpack', cat:'accessories' },
  { name:'Sunglasses', cat:'accessories' },
  { name:'Water Bottle', cat:'general' },
  { name:'Snacks', cat:'general' },
];

const QUICK_ADDS = ['Passport','Phone Charger','Adapter','Sunscreen','Toothbrush','Rain Jacket','Power Bank','Headphones','Sunglasses','Day Backpack','First Aid Kit','Travel Pillow'];

// Quick tags
document.getElementById('quick-tags').innerHTML = QUICK_ADDS.map(name =>
  `<button class="quick-tag" onclick="quickAdd('${name}')">${name}</button>`
).join('');

function quickAdd(name) {
  const existing = Packing.forTrip(tripId);
  if (existing.find(i => i.name.toLowerCase() === name.toLowerCase())) { showToast('Already in your list','info'); return; }
  Packing.create({ tripId, name, category:'general' });
  render();
  showToast(`${name} added!`,'success');
}

function addItem() {
  const input = document.getElementById('new-item');
  const name = input.value.trim();
  if (!name) return;
  const cat = document.getElementById('new-cat').value;
  Packing.create({ tripId, name, category:cat });
  input.value = '';
  render();
  showToast('Item added!','success');
}

function toggleItem(id) {
  Packing.toggle(id);
  render();
}

function deleteItem(id) {
  Packing.delete(id);
  render();
  showToast('Item removed','info');
}

function resetChecklist() {
  if (!confirm('Reset all items to unpacked?')) return;
  Packing.forTrip(tripId).forEach(i => { if(i.isPacked) Packing.toggle(i.id); });
  render();
  showToast('Checklist reset!','info');
}

function addSuggestedItems() {
  const existing = Packing.forTrip(tripId);
  let added = 0;
  ESSENTIALS.forEach(e => {
    if (!existing.find(i => i.name.toLowerCase() === e.name.toLowerCase())) {
      Packing.create({ tripId, name:e.name, category:e.cat });
      added++;
    }
  });
  render();
  showToast(`${added} essential items added!`,'success');
}

function render() {
  const items = Packing.forTrip(tripId);
  const packed = items.filter(i => i.isPacked).length;
  const total = items.length;
  const pct = total > 0 ? Math.round((packed/total)*100) : 0;

  document.getElementById('progress-label').textContent = `${packed} / ${total}`;
  const bar = document.getElementById('progress-bar');
  bar.style.width = pct + '%';
  bar.className = 'progress-bar-fill' + (pct >= 100 ? ' accent' : pct >= 50 ? ' gold' : '');

  // Category summary
  const catCounts = {};
  Object.keys(CAT_INFO).forEach(k => catCounts[k] = { total:0, packed:0 });
  items.forEach(i => {
    const c = i.category || 'general';
    if (!catCounts[c]) catCounts[c] = { total:0, packed:0 };
    catCounts[c].total++;
    if (i.isPacked) catCounts[c].packed++;
  });

  document.getElementById('cat-summary').innerHTML = Object.entries(CAT_INFO).map(([k,info]) => {
    const c = catCounts[k] || { total:0, packed:0 };
    if (c.total === 0) return '';
    return `<div style="display:flex;align-items:center;justify-content:space-between;font-size:.8rem;">
      <span>${info.emoji} ${info.label}</span>
      <span style="color:${c.packed===c.total?'var(--success)':'var(--text-muted)'};">${c.packed}/${c.total}</span>
    </div>`;
  }).join('');

  // Group by category
  const grouped = {};
  items.forEach(i => {
    const c = i.category || 'general';
    if (!grouped[c]) grouped[c] = [];
    grouped[c].push(i);
  });

  const container = document.getElementById('items-container');
  if (!items.length) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🧳</div><div class="empty-state-title">No items yet</div><div class="empty-state-desc">Add items above or click "Add Essentials" to get started!</div></div>`;
    return;
  }

  container.innerHTML = Object.entries(grouped).map(([cat, catItems]) => {
    const info = CAT_INFO[cat] || CAT_INFO.general;
    return `<div class="cat-section">
      <div class="cat-header">
        <div class="cat-header-icon" style="background:${info.color}22;border:1px solid ${info.color}44;">${info.emoji}</div>
        ${info.label}
        <span style="color:var(--text-muted);font-size:.75rem;font-weight:400;margin-left:auto;">${catItems.filter(i=>i.isPacked).length}/${catItems.length}</span>
      </div>
      ${catItems.map(item => `
        <div class="pack-item ${item.isPacked?'packed':''}" onclick="toggleItem('${item.id}')">
          <div class="pack-check">${item.isPacked ? '✓' : ''}</div>
          <div class="pack-name">${item.name}</div>
          <button class="btn btn-danger btn-sm btn-icon" onclick="event.stopPropagation();deleteItem('${item.id}')" style="opacity:.5;" title="Remove">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>`).join('')}
    </div>`;
  }).join('');
}

render();
</script>
<script src="js/gsap-3d.js"></script>
</body>
</html>
