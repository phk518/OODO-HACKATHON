<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Traveloop — Trip Notes & Journal</title>
  <meta name="description" content="Keep track of travel notes, reminders, and journal entries for your trip."/>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="stylesheet" href="css/components.css"/>
  <link rel="stylesheet" href="css/gsap-3d.css"/>
  <style>
    .notes-layout { display:grid; grid-template-columns:280px 1fr; gap:var(--space-xl); align-items:start; }
    .notes-sidebar { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-xl); padding:var(--space-xl); position:sticky; top:calc(var(--navbar-h)+20px); }
    .note-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:var(--space-lg); margin-bottom:var(--space-md); transition:all .2s; position:relative; overflow:hidden; }
    .note-card:hover { border-color:var(--border-hover); box-shadow:var(--shadow-md); }
    .note-card::before { content:''; position:absolute; top:0; left:0; width:4px; height:100%; background:var(--grad-primary); border-radius:0 4px 4px 0; }
    .note-card.stop-note::before { background:var(--grad-accent); }
    .note-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:var(--space-sm); }
    .note-timestamp { font-size:.7rem; color:var(--text-muted); }
    .note-stop-badge { font-size:.72rem; color:var(--accent); background:var(--accent-dim); padding:2px 8px; border-radius:var(--radius-full); }
    .note-content { font-size:.875rem; line-height:1.6; color:var(--text-secondary); white-space:pre-wrap; word-break:break-word; }
    .note-actions { display:flex; gap:6px; margin-top:var(--space-md); padding-top:var(--space-sm); border-top:1px solid var(--border); }
    .add-note-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-xl); padding:var(--space-xl); margin-bottom:var(--space-xl); }
    .add-note-card .form-textarea { min-height:120px; }
    .filter-row { display:flex; gap:var(--space-sm); margin-bottom:var(--space-lg); flex-wrap:wrap; }
    .note-count { font-size:.8rem; color:var(--text-muted); margin-bottom:var(--space-md); }
    .note-edit-area { display:none; }
    .note-edit-area.active { display:block; }
    .note-view { display:block; }
    .note-view.hidden { display:none; }
  </style>
</head>
<body class="bg-dots">
<div class="loading-screen"><div class="loading-logo">✈</div><div style="color:var(--text-secondary);font-size:0.9rem;">Traveloop</div><div class="loading-bar"><div class="loading-bar-fill"></div></div></div>
<canvas id="particles-canvas"></canvas>
<header id="main-navbar" class="navbar"></header>
<main class="page-wrapper">

  <div class="page-header animate-in" style="display:flex;align-items:center;justify-content:space-between;">
    <div>
      <div style="margin-bottom:4px;"><a id="back-link" href="itinerary.html" class="btn btn-ghost btn-sm">← Back to Itinerary</a></div>
      <h1 class="page-title">📝 Trip Notes & Journal</h1>
      <p class="page-subtitle" id="trip-name-sub"></p>
    </div>
  </div>

  <!-- Add Note -->
  <div class="add-note-card animate-in stagger-1">
    <div style="font-weight:700;font-size:.9rem;margin-bottom:var(--space-md);">✍️ New Note</div>
    <div style="display:flex;flex-direction:column;gap:var(--space-md);">
      <textarea id="note-content" class="form-textarea" placeholder="Write a note, reminder, or journal entry..."></textarea>
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:var(--space-sm);">
          <label class="form-label" style="margin:0;">Linked to:</label>
          <select id="note-stop" class="form-select" style="width:200px;padding:8px 12px;font-size:.8rem;">
            <option value="">📋 General Trip Note</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="addNote()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Note
        </button>
      </div>
    </div>
  </div>

  <!-- Filter -->
  <div class="filter-row animate-in stagger-1">
    <button class="chip active" onclick="setFilter('all',this)">📋 All Notes</button>
    <button class="chip" onclick="setFilter('general',this)">🗒️ General</button>
    <button class="chip" onclick="setFilter('stops',this)">📍 By Stop</button>
  </div>

  <div class="notes-layout animate-in stagger-2">
    <!-- Sidebar -->
    <div class="notes-sidebar">
      <div style="font-size:3rem;text-align:center;margin-bottom:var(--space-md);">📝</div>
      <div style="text-align:center;font-weight:700;font-size:1.1rem;" id="sidebar-trip">Trip Name</div>
      <div style="text-align:center;color:var(--text-secondary);font-size:.8rem;margin-top:4px;" id="sidebar-dates"></div>
      <hr class="divider"/>
      <div style="display:flex;flex-direction:column;gap:var(--space-sm);">
        <div style="display:flex;justify-content:space-between;font-size:.8rem;">
          <span style="color:var(--text-muted);">Total Notes</span>
          <span style="font-weight:700;" id="total-notes">0</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:.8rem;">
          <span style="color:var(--text-muted);">General</span>
          <span style="font-weight:700;" id="general-notes">0</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:.8rem;">
          <span style="color:var(--text-muted);">Stop-linked</span>
          <span style="font-weight:700;" id="stop-notes">0</span>
        </div>
      </div>
      <hr class="divider"/>
      <div style="font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:var(--space-sm);">Quick Links</div>
      <a id="packing-link" href="#" class="btn btn-ghost btn-sm btn-full">🧳 Packing List</a>
      <a id="budget-link" href="#" class="btn btn-ghost btn-sm btn-full" style="margin-top:4px;">💰 Budget</a>
    </div>

    <!-- Notes List -->
    <div>
      <div class="note-count" id="notes-count"></div>
      <div id="notes-container"></div>
    </div>
  </div>

</main>

<div id="toast-container"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script>
const user = Session.require();
renderNavbar(user);
const tripId = getParam('trip');
if (!tripId) window.location.href = 'trips.html';
const trip = Trips.find(tripId);
if (!trip) window.location.href = 'trips.html';

document.getElementById('back-link').href = `itinerary.html?trip=${tripId}`;
document.getElementById('packing-link').href = `packing.html?trip=${tripId}`;
document.getElementById('budget-link').href = `budget.html?trip=${tripId}`;
document.getElementById('trip-name-sub').textContent = trip.name;
document.getElementById('sidebar-trip').textContent = trip.name;
document.getElementById('sidebar-dates').textContent = `${formatDate(trip.startDate,{month:'short',day:'numeric'})} — ${formatDate(trip.endDate,{month:'short',day:'numeric',year:'numeric'})}`;

// Populate stop dropdown
const stops = Stops.forTrip(tripId);
const stopSelect = document.getElementById('note-stop');
stops.forEach(s => {
  const opt = document.createElement('option');
  opt.value = s.id;
  opt.textContent = `${s.emoji||'📍'} ${s.cityName}`;
  stopSelect.appendChild(opt);
});

let activeFilter = 'all';

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-row .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function addNote() {
  const content = document.getElementById('note-content').value.trim();
  if (!content) { showToast('Please write something first','warning'); return; }
  const stopId = document.getElementById('note-stop').value || null;
  Notes.create({ tripId, stopId, content });
  document.getElementById('note-content').value = '';
  document.getElementById('note-stop').value = '';
  render();
  showToast('Note added!','success');
}

function deleteNote(id) {
  if (!confirm('Delete this note?')) return;
  Notes.delete(id);
  render();
  showToast('Note deleted','info');
}

function startEdit(id) {
  document.getElementById('view-'+id).classList.add('hidden');
  document.getElementById('edit-'+id).classList.add('active');
}

function cancelEdit(id) {
  document.getElementById('view-'+id).classList.remove('hidden');
  document.getElementById('edit-'+id).classList.remove('active');
}

function saveEdit(id) {
  const textarea = document.getElementById('textarea-'+id);
  const content = textarea.value.trim();
  if (!content) return;
  Notes.update(id, { content });
  render();
  showToast('Note updated!','success');
}

function render() {
  let notes = Notes.forTrip(tripId);

  // Stats
  const generalCount = notes.filter(n => !n.stopId).length;
  const stopCount = notes.filter(n => n.stopId).length;
  document.getElementById('total-notes').textContent = notes.length;
  document.getElementById('general-notes').textContent = generalCount;
  document.getElementById('stop-notes').textContent = stopCount;

  // Filter
  if (activeFilter === 'general') notes = notes.filter(n => !n.stopId);
  if (activeFilter === 'stops') notes = notes.filter(n => n.stopId);

  document.getElementById('notes-count').textContent = `${notes.length} note${notes.length!==1?'s':''} found`;

  const container = document.getElementById('notes-container');
  if (!notes.length) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📝</div><div class="empty-state-title">No notes yet</div><div class="empty-state-desc">Write your first note above — reminders, journal entries, or hotel check-in details!</div></div>`;
    return;
  }

  container.innerHTML = notes.map(note => {
    const stop = note.stopId ? Stops.find(note.stopId) : null;
    const time = new Date(note.createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});
    const updated = note.updatedAt !== note.createdAt ? ` (edited)` : '';
    return `
      <div class="note-card ${stop?'stop-note':''} animate-in">
        <div class="note-header">
          <div>
            <div class="note-timestamp">${time}${updated}</div>
            ${stop ? `<span class="note-stop-badge">${stop.emoji||'📍'} ${stop.cityName}</span>` : ''}
          </div>
        </div>
        <div class="note-view" id="view-${note.id}">
          <div class="note-content">${note.content}</div>
        </div>
        <div class="note-edit-area" id="edit-${note.id}">
          <textarea class="form-textarea" id="textarea-${note.id}" style="min-height:80px;">${note.content}</textarea>
          <div style="display:flex;gap:6px;margin-top:8px;">
            <button class="btn btn-primary btn-sm" onclick="saveEdit('${note.id}')">Save</button>
            <button class="btn btn-ghost btn-sm" onclick="cancelEdit('${note.id}')">Cancel</button>
          </div>
        </div>
        <div class="note-actions">
          <button class="btn btn-ghost btn-sm" onclick="startEdit('${note.id}')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Edit
          </button>
          <button class="btn btn-danger btn-sm" onclick="deleteNote('${note.id}')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            Delete
          </button>
        </div>
      </div>`;
  }).join('');
}

render();
</script>
<script src="js/gsap-3d.js"></script>
</body>
</html>
