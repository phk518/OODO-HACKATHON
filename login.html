<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Traveloop — Login</title>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="stylesheet" href="css/components.css"/>
  <link rel="stylesheet" href="css/gsap-3d.css"/>
  <style>
    .login-backdrop { position: fixed; inset: 0; z-index: -1; background: url('https://images.unsplash.com/photo-1506929662133-570293363f78?auto=format&fit=crop&q=80&w=1600') center/cover no-repeat; }
    .login-backdrop::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(15,23,42,0.4), rgba(15,23,42,0.9)); }
    
    .glass-login-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-xl); padding: var(--space-2xl); width: 100%; max-width: 440px; box-shadow: var(--shadow-2xl); }
    
    .input-icon-wrap { position: relative; width: 100%; }
    .input-icon-wrap .material-symbols-outlined { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); transition: color 0.2s; }
    .input-icon-wrap:focus-within .material-symbols-outlined { color: var(--primary); }
    .input-icon-wrap input { padding-left: 48px; }

    .divider { display: flex; align-items: center; gap: var(--space-md); margin: var(--space-xl) 0; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-dots">
  <div class="login-backdrop"></div>
  <canvas id="particles-canvas"></canvas>

  <main class="glass-login-card animate-in">
    <!-- Logo -->
    <div class="flex-col items-center text-center mb-2xl">
      <div class="w-16 h-16 bg-primary rounded-full flex items-center justify-center shadow-lg mb-md">
        <span class="material-symbols-outlined text-white text-[32px]" style="font-variation-settings: 'FILL' 1;">explore</span>
      </div>
      <h1 class="h2" style="margin-bottom:var(--space-xs);">Traveloop</h1>
      <p class="body-xs text-muted max-w-xs">Your professional partner for seamless travel planning and active exploration.</p>
    </div>

    <!-- Form -->
    <form id="login-form" class="flex-col gap-lg">
      <div class="form-group">
        <label class="form-label ml-xs">Username or Email</label>
        <div class="input-icon-wrap">
          <span class="material-symbols-outlined">person</span>
          <input type="email" id="email" class="form-input" placeholder="Enter your email" required />
        </div>
      </div>

      <div class="form-group">
        <div class="flex justify-between items-center px-1 mb-xs">
          <label class="form-label">Password</label>
          <a href="#" class="label-sm text-primary hover:underline">Forgot password?</a>
        </div>
        <div class="input-icon-wrap">
          <span class="material-symbols-outlined">lock</span>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required />
        </div>
      </div>

      <div class="flex items-center gap-sm mb-md px-xs">
        <input type="checkbox" id="remember" class="w-4 h-4 rounded border-gray-300 text-primary" />
        <label for="remember" class="body-xs text-muted">Keep me signed in</label>
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-full flex items-center justify-center gap-sm shadow-md">
        Login <span class="material-symbols-outlined" style="font-size:20px;">arrow_forward</span>
      </button>
    </form>

    <div class="divider">or</div>

    <!-- Social -->
    <div class="flex-col items-center gap-xl">
      <p class="body-xs text-muted">
        New to Traveloop? <a href="register.html" class="text-primary font-bold hover:underline">Create an account</a>
      </p>
      <div class="flex gap-md">
        <button class="btn btn-icon btn-ghost" style="border:1px solid rgba(255,255,255,0.1); width:48px; height:48px;">
          <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" style="width:20px; height:20px;" />
        </button>
        <button class="btn btn-icon btn-ghost" style="border:1px solid rgba(255,255,255,0.1); width:48px; height:48px;">
          <span class="material-symbols-outlined text-white">ios</span>
        </button>
      </div>
    </div>
  </main>

  <footer style="position:fixed; bottom:var(--space-xl); left:0; right:0; text-align:center;">
    <p class="body-xs text-muted">© 2024 Traveloop Management. All rights reserved.</p>
    <div class="flex justify-center gap-lg mt-sm">
      <a href="#" class="label-sm text-muted hover:text-white transition-colors">Privacy Policy</a>
      <a href="#" class="label-sm text-muted hover:text-white transition-colors">Terms of Service</a>
    </div>
  </footer>

  <div id="toast-container"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script>
    if (Session.get()) window.location.href = 'dashboard.html';

    document.getElementById('login-form').onsubmit = function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const pass  = document.getElementById('password').value;

      const user = Auth.login(email, pass);
      if (user) {
        showToast(`Welcome back, ${user.name}!`, 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 1500);
      } else {
        showToast('Invalid credentials. Try demo@traveloop.com / demo123', 'error');
      }
    };
  </script>
  <script src="js/gsap-3d.js"></script>
</body>
</html>
