<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Traveloop - Sign In</title>
  <meta name="description" content="Sign in to Traveloop and continue your personalized travel journey."/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">tailwind.config = {darkMode: "class", theme: {extend: {colors: {"primary": "#031632", "primary-container": "#1a2b48", "on-primary": "#ffffff", "on-primary-container": "#8293b5", "secondary": "#ac3509", "secondary-container": "#fe6f42", "on-secondary": "#ffffff", outline: "#75777e", background: "#fbf9fb", "surface-container": "#efedf0", "surface-container-high": "#e9e7ea", "surface-container-lowest": "#ffffff", surface: "#fbf9fb", "on-surface": "#1b1b1e", "on-surface-variant": "#44474d", "outline-variant": "#c5c6ce", error: "#ba1a1a"}, borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"}, fontFamily: {sans: ["Plus Jakarta Sans", "sans-serif"]}, fontSize: {"label-md": ["12px", {lineHeight: "1.4", letterSpacing: "0.05em", fontWeight: "600"}], "body-md": ["16px", {lineHeight: "1.6", fontWeight: "400"}], "headline-md": ["24px", {lineHeight: "1.3", fontWeight: "600"}], "headline-lg": ["32px", {lineHeight: "1.2", fontWeight: "700"}]}}}};
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col items-center">

  <!-- TopAppBar -->
  <header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md shadow-[0px_4px_10px_rgba(26,43,60,0.08)]">
    <div class="flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 w-full max-w-[1440px] mx-auto">
      <div class="flex items-center gap-4">
        <span class="material-symbols-outlined text-primary">menu</span>
        <h1 class="font-display-lg text-headline-md text-primary tracking-tight">Traveloop</h1>
      </div>
      <div class="w-10 h-10 rounded-full bg-surface-container overflow-hidden">
        <img
          alt="User profile avatar"
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuC7AWi1VYeT-90F9QjrXbKdWnGlFKitzSODHrT2UeNr95zsTOMeWE5Zw25R7rWafxyRQEEatjdUl_UiQQ-iwcRHYJWJZ0t36p3jwXVq-QwFtFQXUDEW88dmiU2BEPYF_BBDLnarvGwuGqFJJM8uSDOZXJqhqw-bkOkdDRFr363T48kyAtpOzNXJ9obNnf4WRXK3vgKAUN81fVNIc-J_kENUJoQBIuIYfvrIA9aBQ-wX2kldHyQwcw9JwjVzvQJwSeo4V3cE6NAjZlQ"
        />
      </div>
    </div>
  </header>

  <main class="relative w-full min-h-screen flex items-center justify-center pt-16">

    <!-- Background Imagery -->
    <div class="absolute inset-0 z-0 overflow-hidden">
      <img
        alt="Scenic mountain landscape at sunrise"
        class="w-full h-full object-cover"
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuBf5Dc-cG9d-6YdhansRJuEt1HTKW51nQHEcZg6nUdMB1YkPPFjbUbcJ4fXzjx9zrJaSGTrWAsUnhFVDY160wIL9-moNcRe8DGjhmfZ-Epjc5ofP4RVgcW8Dg-ACq7qvlVYjqxVRiYuGFC54kggaumWxwtK0dNQrfS2AnlHiTmRb5s7FPwHUfB0jk6FU05V4_E15bpvRrPqRW0fGOv9cx4RQ0xmOef9By9bVD7ilaRkBME7DFE1STEWH9xXtlWH3Ujyu_FQAACxpLU"
      />
      <div class="absolute inset-0 bg-secondary/20"></div>
    </div>

    <!-- Auth Container -->
    <div class="relative z-10 w-full max-w-[480px] px-margin-mobile">
      <div class="glass-panel p-8 md:p-10 rounded-xl shadow-[0px_25px_50px_rgba(26,43,60,0.15)] border border-white/30">

        <!-- Branding -->
        <div class="text-center mb-8">
          <h2 class="font-display-lg text-headline-lg text-primary mb-2">Welcome Back</h2>
          <p class="font-body-md text-on-surface-variant">The horizon is calling. Sign in to continue your journey.</p>
        </div>

        <!-- Tabs -->
        <div class="flex items-center justify-center mb-8 p-1 bg-surface-container/50 rounded-lg">
          <button id="tab-login" class="flex-1 py-2 font-sans font-semibold text-sm text-primary bg-white rounded-md shadow-sm transition-all duration-200">
            Login
          </button>
          <a href="register.html" class="flex-1 py-2 font-sans font-semibold text-sm text-on-surface-variant hover:text-primary transition-colors text-center">
            Sign Up
          </a>
        </div>

        <!-- Form -->
        <form id="login-form" class="space-y-6" onsubmit="handleLogin(event)">
          <div class="space-y-2">
            <label class="font-label-md text-label-md text-on-surface-variant block" for="email">Email Address</label>
            <input
              id="email"
              class="w-full h-12 px-4 bg-white/50 border border-outline-variant/30 rounded-xl focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all placeholder:text-outline/50"
              placeholder="explorer@traveloop.com"
              type="email"
              autocomplete="email"
            />
          </div>
          <div class="space-y-2">
            <div class="flex justify-between items-center">
              <label class="font-label-md text-label-md text-on-surface-variant block" for="password">Password</label>
              <a class="font-label-md text-label-md text-primary hover:opacity-80 transition-opacity" href="#">Forgot Password?</a>
            </div>
            <div class="relative">
              <input
                id="password"
                class="w-full h-12 px-4 bg-white/50 border border-outline-variant/30 rounded-xl focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all placeholder:text-outline/50"
                placeholder="••••••••"
                type="password"
                autocomplete="current-password"
              />
              <button
                id="btn-toggle-password"
                class="absolute right-4 top-3 text-on-surface-variant/60"
                type="button"
                aria-label="Toggle password visibility"
              >
                <span class="material-symbols-outlined">visibility</span>
              </button>
            </div>
          </div>
          <button
            id="btn-sign-in"
            class="w-full h-14 bg-primary-container text-on-primary-container font-label-md text-label-md rounded-xl shadow-[0px_4px_10px_rgba(255,140,0,0.3)] active:scale-95 transition-all hover:brightness-110"
            type="submit"
          >
            Sign In
          </button>
        </form>

        <!-- Divider -->
        <div class="relative my-8 text-center">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-outline-variant/30"></div>
          </div>
          <span class="relative px-4 bg-transparent font-label-md text-label-md text-on-surface-variant uppercase tracking-widest text-[10px]">or continue with</span>
        </div>

        <!-- Social Logins -->
        <div class="grid grid-cols-2 gap-4">
          <button id="btn-google" class="flex items-center justify-center h-12 bg-white/50 border border-outline-variant/30 rounded-xl hover:bg-white transition-colors active:scale-95">
            <img
              alt="Google Logo"
              class="w-5 h-5 mr-3"
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuBHiIhIg_2AYLzwtQRkIzlQdlVtHGRCBwvqwOoet4OiRswHg6J7doFKtGeTb9bROElV0OMV4lmGnPyIKhzu7II_9uq4Fi_yKZhaIiqekZdnFM4yHyeWOkHdQN11P3ILGQH31yocIGJ01UFIlbzmgv3-l2GQYapk4MOjO4d13oIHbM5U-ifhn7V6r2ehsVjsxwf8fXZIqC3cmOPARLOmY37DpmI47LWce6wYF9aJcR0WRu3unKLAS09ZjXepgUIET4y49mC8ZlBeQP8"
            />
            <span class="font-label-md text-label-md text-secondary">Google</span>
          </button>
          <button id="btn-apple" class="flex items-center justify-center h-12 bg-white/50 border border-outline-variant/30 rounded-xl hover:bg-white transition-colors active:scale-95">
            <span class="material-symbols-outlined mr-3 text-on-surface" style="font-variation-settings: 'FILL' 1;">ios</span>
            <span class="font-label-md text-label-md text-secondary">Apple</span>
          </button>
        </div>

        <p class="mt-10 text-center font-body-md text-on-surface-variant text-sm">
          By signing in, you agree to our
          <a class="text-primary font-bold hover:underline" href="#">Terms</a> and
          <a class="text-primary font-bold hover:underline" href="#">Privacy Policy</a>.
        </p>
      </div>
    </div>

  </main>

  <script src="js/db.js"></script>
  <script>
    // Auto-redirect if already logged in
    if (Session.get()) window.location.href = 'dashboard.html';

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const pass  = document.getElementById('password').value;
      try {
        const user = Users.authenticate(email, pass);
        Session.set(user);
        window.location.href = 'dashboard.html';
      } catch (err) {
        let errEl = document.getElementById('login-error');
        if (!errEl) {
          errEl = document.createElement('p');
          errEl.id = 'login-error';
          errEl.className = 'text-xs text-red-600 mt-2 text-center';
          document.getElementById('login-form').appendChild(errEl);
        }
        errEl.textContent = err.message + ' — Try demo@traveloop.com / demo123';
      }
    }

    // Password visibility toggle
    const toggleBtn = document.getElementById('btn-toggle-password');
    const passwordInput = document.getElementById('password');
    const toggleIcon = toggleBtn.querySelector('.material-symbols-outlined');
    toggleBtn.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      toggleIcon.textContent = isHidden ? 'visibility_off' : 'visibility';
    });
  </script>

</body>
</html>
