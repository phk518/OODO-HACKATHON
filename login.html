<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traveloop — Sign In</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/gsap-3d.css" />
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--grad-hero);
      padding: var(--space-xl);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: var(--space-2xl);
      box-shadow: var(--shadow-lg);
    }
    .auth-header {
      text-align: center;
      margin-bottom: var(--space-2xl);
    }
    .auth-logo {
      font-size: 2.5rem;
      margin-bottom: var(--space-md);
      display: block;
    }
    .auth-title {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .auth-subtitle {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }
    .auth-tabs {
      display: flex;
      background: var(--bg-elevated);
      padding: 4px;
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-xl);
    }
    .auth-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s;
    }
    .auth-tab.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }
    .form-group {
      margin-bottom: var(--space-lg);
    }
    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      transition: border-color 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .auth-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--danger);
      padding: var(--space-md);
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      margin-bottom: var(--space-lg);
      display: none;
    }
  </style>
</head>
<body class="bg-base">
  <canvas id="particles-canvas"></canvas>

  <main class="auth-wrapper">
    <div class="auth-card animate-in">
      <div class="auth-header">
        <span class="auth-logo">✈️</span>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Continue your journey with Traveloop</p>
      </div>

      <div class="auth-tabs">
        <div class="auth-tab active">Sign In</div>
        <a href="register.html" class="auth-tab">Sign Up</a>
      </div>

      <div id="login-error" class="auth-error"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="explorer@traveloop.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required />
        </div>
        <button id="btn-sign-in" type="submit" class="btn btn-primary btn-full btn-lg">Sign In</button>
      </form>

      <div style="margin-top:var(--space-xl);text-align:center;font-size:0.8rem;color:var(--text-secondary);">
        Don't have an account? <a href="register.html" style="color:var(--primary);font-weight:600;">Create one</a>
      </div>
    </div>
  </main>

  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/gsap-3d.js"></script>
  <script>
    if (Session.get()) window.location.href = 'dashboard.html';

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const pass  = document.getElementById('password').value;
      const errEl = document.getElementById('login-error');
      
      try {
        const user = Users.authenticate(email, pass);
        Session.set(user);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errEl.textContent = err.message + ' — Try demo@traveloop.com / demo123';
        errEl.style.display = 'block';
      }
    }
  </script>
</body>
</html>
