<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Join Traveloop | Modern Explorer</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-low": "#f3f3f3",
                    "inverse-on-surface": "#f0f1f1",
                    "background": "#f9f9f9",
                    "primary": "#875200",
                    "on-surface-variant": "#564334",
                    "tertiary": "#5a5f62",
                    "on-tertiary-fixed-variant": "#43474b",
                    "on-secondary": "#ffffff",
                    "on-secondary-fixed-variant": "#38485a",
                    "on-primary-container": "#5b3600",
                    "on-error": "#ffffff",
                    "on-error-container": "#93000a",
                    "surface-dim": "#dadada",
                    "error": "#ba1a1a",
                    "primary-fixed": "#ffddba",
                    "secondary-fixed": "#d2e4fb",
                    "on-background": "#1a1c1c",
                    "tertiary-container": "#a6aaae",
                    "surface-container-high": "#e8e8e8",
                    "on-primary-fixed": "#2b1700",
                    "surface-variant": "#e2e2e2",
                    "inverse-primary": "#ffb865",
                    "primary-container": "#ef9500",
                    "outline-variant": "#ddc1ae",
                    "surface": "#f9f9f9",
                    "surface-container": "#eeeeee",
                    "on-tertiary-fixed": "#171c1f",
                    "secondary-fixed-dim": "#b7c8de",
                    "on-surface": "#1a1c1c",
                    "primary-fixed-dim": "#ffb865",
                    "on-secondary-container": "#556679",
                    "on-tertiary": "#ffffff",
                    "error-container": "#ffdad6",
                    "on-primary": "#ffffff",
                    "surface-container-highest": "#e2e2e2",
                    "tertiary-fixed": "#dfe3e7",
                    "secondary-container": "#d2e4fb",
                    "tertiary-fixed-dim": "#c3c7cb",
                    "inverse-surface": "#2f3131",
                    "outline": "#897362",
                    "on-secondary-fixed": "#0b1d2d",
                    "on-tertiary-container": "#3a3f42",
                    "on-primary-fixed-variant": "#673d00",
                    "surface-container-lowest": "#ffffff",
                    "surface-bright": "#f9f9f9",
                    "surface-tint": "#875200",
                    "secondary": "#4f6073"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "gutter-mobile": "16px",
                    "gutter-desktop": "24px",
                    "margin-mobile": "20px",
                    "unit": "4px",
                    "section-gap": "48px",
                    "margin-desktop": "64px"
            },
            "fontFamily": {
                    "display-lg": ["Montserrat"],
                    "body-lg": ["Inter"],
                    "headline-lg": ["Montserrat"],
                    "body-md": ["Inter"],
                    "headline-md": ["Montserrat"],
                    "headline-lg-mobile": ["Montserrat"],
                    "label-md": ["Inter"]
            },
            "fontSize": {
                    "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "1.2", "fontWeight": "700"}],
                    "label-md": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
        }
        .vignette-overlay {
            background: linear-gradient(to bottom, rgba(26, 43, 60, 0) 0%, rgba(26, 43, 60, 0.4) 100%);
        }
        body { min-height: max(884px, 100dvh); }
    </style>
  </head>
<body class="bg-background text-on-background font-body-md selection:bg-primary-container selection:text-on-primary-container">
<main class="min-h-screen w-full flex flex-col md:flex-row overflow-hidden">
<!-- Left Side: Visual/Hero -->
<section class="hidden md:flex md:w-5/12 lg:w-1/2 relative bg-secondary overflow-hidden">
<img alt="Golden hour beach" class="absolute inset-0 w-full h-full object-cover" data-alt="A breathtaking aerial view of a pristine tropical beach during the golden hour sunset. The turquoise ocean waves gently lap against soft white sands, illuminated by a warm Amber Sunset glow. In the distance, lush green palm trees frame the coast, creating a serene and adventurous atmosphere. The lighting is soft and cinematic, perfectly capturing the premium minimalist aesthetic of the Traveloop brand." src="https://lh3.googleusercontent.com/aida-public/AB6AXuARPYB7PuToeJbcW1iODqrbeKaK0UhfMW9FhumAWXYikgPM6ua1HBC2CSiB_U3V1t070DowZgfGPnKDThgSFK6rmG9SHKGRa-WtFbzFLXx4jT1CTTIOTc-fmw0_goKcCUnuUL58ApbnTfj_UmXJSXIce29jcx-z4zpIx_9hAcCVqbGr-o71JdelXYVgGWGXstH54sI17XB9AJm9R4UCINnZC2xCKlpCCqxviGQxQv-1DReDi197iiEk8v6v9e8-Op4Rd-LRiRsCAto"/>
<div class="absolute inset-0 vignette-overlay flex flex-col justify-end p-margin-desktop">
<div class="max-w-md">
<h1 class="font-display-lg text-display-lg text-white mb-4">Traveloop</h1>
<p class="font-body-lg text-body-lg text-white/90">Your journey into the extraordinary begins here. Curated adventures for the modern explorer.</p>
</div>
</div>
</section>
<!-- Right Side: Form -->
<section class="flex-1 flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop bg-surface relative overflow-y-auto">
<!-- Mobile Brand Logo -->
<div class="md:hidden w-full flex justify-center mb-8">
<span class="font-display-lg text-headline-md text-primary tracking-tight">Traveloop</span>
</div>
<div class="w-full max-w-[480px] bg-white p-8 md:p-10 rounded-xl shadow-[0px_4px_10px_rgba(26,43,60,0.08)]">
<header class="mb-8">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Create Account</h2>
<p class="font-body-md text-on-surface-variant">Step into a world of sophisticated travel planning.</p>
</header>
<form class="flex flex-col gap-5" action="dashboard.html">
<!-- Full Name -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-2" for="fullname">
<span class="material-symbols-outlined text-[18px]">person</span>
                            Full Name
                        </label>
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant/50 bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none text-on-surface placeholder:text-on-surface-variant/40" id="fullname" placeholder="John Doe" type="text" required/>
</div>
<!-- Email -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-2" for="email">
<span class="material-symbols-outlined text-[18px]">mail</span>
                            Email Address
                        </label>
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant/50 bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none text-on-surface placeholder:text-on-surface-variant/40" id="email" placeholder="explorer@traveloop.com" type="email" required/>
</div>
<!-- Password Grid -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-2" for="password">
<span class="material-symbols-outlined text-[18px]">lock</span>
                                Password
                            </label>
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant/50 bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none text-on-surface placeholder:text-on-surface-variant/40" id="password" placeholder="••••••••" type="password" required/>
</div>
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-2" for="confirm_password">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
                                Confirm
                            </label>
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant/50 bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none text-on-surface placeholder:text-on-surface-variant/40" id="confirm_password" placeholder="••••••••" type="password" required/>
</div>
</div>
<!-- Location -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-2" for="location">
<span class="material-symbols-outlined text-[18px]">location_on</span>
                            Location
                        </label>
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant/50 bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none text-on-surface placeholder:text-on-surface-variant/40" id="location" placeholder="San Francisco, CA" type="text"/>
</div>
<!-- Home Address -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-2" for="address">
<span class="material-symbols-outlined text-[18px]">home</span>
                            Home Address
                        </label>
<textarea class="w-full px-4 py-3 rounded-lg border border-outline-variant/50 bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none text-on-surface placeholder:text-on-surface-variant/40 resize-none" id="address" placeholder="123 Explorer Way, Suite 400" rows="2"></textarea>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 mt-2">
<input class="mt-1 w-4 h-4 rounded text-primary focus:ring-primary border-outline-variant" id="terms" type="checkbox" required/>
<label class="text-label-md text-on-surface-variant" for="terms">I agree to the <a class="text-primary font-bold hover:underline" href="#">Terms of Service</a> and <a class="text-primary font-bold hover:underline" href="#">Privacy Policy</a>.</label>
</div>
<!-- Submit Button -->
<button class="mt-4 w-full h-14 bg-primary text-white font-headline-md rounded-xl shadow-lg hover:bg-on-primary-fixed-variant active:scale-95 transition-all duration-200" type="submit">
                        Sign Up
                    </button>
</form>
<footer class="mt-8 text-center">
<p class="font-label-md text-on-surface-variant">
                        Already have an account? 
                        <a class="text-primary font-bold hover:underline ml-1" href="login.html">Log In</a>
</p>
</footer>
</div>
<!-- Subtle Decorative Element -->
<div class="mt-12 hidden md:block">
<div class="flex items-center gap-8 opacity-20">
<span class="material-symbols-outlined text-4xl">flight_takeoff</span>
<span class="material-symbols-outlined text-4xl">travel_explore</span>
<span class="material-symbols-outlined text-4xl">beach_access</span>
</div>
</div>
</section>
</main>
</body></html>
