<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traveloop — My Trips</title>
  <meta name="description" content="View and manage all your Traveloop travel itineraries in one place." />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/gsap-3d.css" />
  <style>
    .trips-toolbar {
      display:flex; align-items:center; gap:var(--space-md);
      margin-bottom:var(--space-xl);
      flex-wrap:wrap;
    }
    .trips-toolbar .search-bar { flex:1; min-width:240px; }
    .trips-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
      gap:var(--space-lg);
    }
    .filter-bar {
      display:flex; gap:var(--space-sm); flex-wrap:wrap;
      margin-bottom:var(--space-lg);
    }
    .trips-count {
      color:var(--text-muted); font-size:0.8rem; margin-bottom:var(--space-md);
    }
  </style>
</head>
<body class="bg-dots">
  <div class="loading-screen"><div class="loading-logo">✈</div><div style="color:var(--text-secondary);font-size:0.9rem;">Traveloop</div><div class="loading-bar"><div class="loading-bar-fill"></div></div></div>
  <canvas id="particles-canvas"></canvas>
  <header id="main-navbar" class="navbar"></header>

  <main class="page-wrapper">
    <div class="page-header flex items-center justify-between animate-in">
      <div>
        <h1 class="page-title">My Trips</h1>
        <p class="page-subtitle">All your adventures, in one place.</p>
      </div>
      <a href="create-trip.html" class="btn btn-accent">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Trip
      </a>
    </div>

    <!-- Filters -->
    <div class="animate-in stagger-1">
      <div class="trips-toolbar">
        <div class="search-bar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="Search trips..." oninput="renderTrips()" />
        </div>
      </div>
      <div class="filter-bar">
        <button class="chip active" data-filter="all"      onclick="setFilter('all',this)">All</button>
        <button class="chip"        data-filter="upcoming" onclick="setFilter('upcoming',this)">✈️ Upcoming</button>
        <button class="chip"        data-filter="ongoing"  onclick="setFilter('ongoing',this)">🟢 Ongoing</button>
        <button class="chip"        data-filter="past"     onclick="setFilter('past',this)">📁 Past</button>
      </div>
      <div class="trips-count" id="trips-count"></div>
    </div>

    <div class="trips-grid animate-in stagger-2" id="trips-grid"></div>

    <div class="empty-state" id="trips-empty" style="display:none;">
      <div class="empty-state-icon">🧳</div>
      <div class="empty-state-title">No trips found</div>
      <div class="empty-state-desc">Try a different filter, or plan your next adventure!</div>
      <a href="create-trip.html" class="btn btn-primary mt-md">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Plan New Trip
      </a>
    </div>
  </main>

  <div id="toast-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script>
    const user = Session.require();
    renderNavbar(user);

    let activeFilter = 'all';

    function setFilter(f, btn) {
      activeFilter = f;
      document.querySelectorAll('.filter-bar .chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      renderTrips();
    }

    function renderTrips() {
      const query  = (document.getElementById('search-input').value || '').toLowerCase();
      let trips    = Trips.forUser(user.id);

      if (activeFilter !== 'all') trips = trips.filter(t => tripStatus(t.startDate, t.endDate) === activeFilter);
      if (query) trips = trips.filter(t => t.name.toLowerCase().includes(query) || (t.description||'').toLowerCase().includes(query));

      const grid  = document.getElementById('trips-grid');
      const empty = document.getElementById('trips-empty');
      document.getElementById('trips-count').textContent = `${trips.length} trip${trips.length !== 1 ? 's' : ''} found`;

      if (trips.length === 0) {
        grid.innerHTML = '';
        empty.style.display = '';
      } else {
        empty.style.display = 'none';
        grid.innerHTML = trips.map(trip => {
          const stops = Stops.forTrip(trip.id);
          return renderTripCard(trip, stops);
        }).join('');
      }
    }

    renderTrips();
  </script>
  <script src="js/gsap-3d.js"></script>
</body>
</html>
