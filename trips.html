<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Traveloop — My Itineraries</title>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="stylesheet" href="css/components.css"/>
  <link rel="stylesheet" href="css/gsap-3d.css"/>
  <style>
    .trip-section { margin-bottom: var(--space-2xl); }
    .trip-section-title { display: flex; align-items: center; gap: var(--space-sm); margin-bottom: var(--space-xl); }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; }
    
    /* Ongoing Card */
    .ongoing-card { display: flex; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden; transition: all 0.3s; }
    .ongoing-card:hover { border-color: var(--border-primary); transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .ongoing-img { width: 340px; height: 260px; object-fit: cover; }
    .ongoing-content { padding: var(--space-xl); flex: 1; display: flex; flex-direction: column; }
    
    /* List View (Completed) */
    .trip-list-item { display: flex; align-items: center; gap: var(--space-xl); padding: var(--space-lg); background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl); margin-bottom: var(--space-md); transition: all 0.2s; }
    .trip-list-item:hover { border-color: var(--border-primary); background: var(--bg-elevated); }
    .trip-list-img { width: 64px; height: 64px; border-radius: var(--radius-lg); object-fit: cover; flex-shrink: 0; }

    @media (max-width: 768px) {
      .ongoing-card { flex-direction: column; }
      .ongoing-img { width: 100%; height: 200px; }
      .trip-list-item { flex-direction: column; align-items: flex-start; gap: var(--space-md); }
    }
  </style>
</head>
<body class="bg-dots">
  <div class="loading-screen"><div class="loading-logo">✈</div><div style="color:var(--text-secondary);font-size:0.9rem;">Traveloop</div><div class="loading-bar"><div class="loading-bar-fill"></div></div></div>
  <canvas id="particles-canvas"></canvas>
  <header id="main-navbar" class="navbar"></header>

  <main class="page-wrapper">
    <!-- Header Area -->
    <div class="page-header flex items-end justify-between animate-in" style="margin-bottom:var(--space-2xl);">
      <div>
        <h1 class="page-title">My Itineraries</h1>
        <p class="page-subtitle">Manage your past, current, and future adventures.</p>
      </div>
      <div class="flex gap-md">
        <div class="search-bar" style="width:260px;">
          <span class="material-symbols-outlined">search</span>
          <input type="text" id="trip-search" placeholder="Search trips..." oninput="renderAll()" />
        </div>
        <a href="create-trip.html" class="btn btn-primary">Create Trip</a>
      </div>
    </div>

    <!-- Ongoing Section -->
    <section id="section-ongoing" class="trip-section animate-in stagger-1">
      <div class="trip-section-title">
        <span class="status-dot" style="background:var(--accent);"></span>
        <h2 class="h4 uppercase tracking-widest" style="font-size:0.8rem; margin:0;">Ongoing</h2>
      </div>
      <div id="ongoing-grid"></div>
    </section>

    <!-- Upcoming Section -->
    <section id="section-upcoming" class="trip-section animate-in stagger-2">
      <div class="trip-section-title">
        <span class="status-dot" style="background:var(--primary);"></span>
        <h2 class="h4 uppercase tracking-widest" style="font-size:0.8rem; margin:0;">Upcoming</h2>
      </div>
      <div class="grid grid-cols-2 md:grid-cols-2 gap-xl" id="upcoming-grid"></div>
    </section>

    <!-- Completed Section -->
    <section id="section-past" class="trip-section animate-in stagger-3">
      <div class="trip-section-title">
        <span class="status-dot" style="background:var(--text-muted);"></span>
        <h2 class="h4 uppercase tracking-widest" style="font-size:0.8rem; margin:0;">Completed</h2>
      </div>
      <div id="past-list"></div>
    </section>

    <div id="empty-state" class="empty-state" style="display:none;">
      <div class="empty-state-icon">🧳</div>
      <div class="empty-state-title">No trips found</div>
      <div class="empty-state-desc">Try a different search or plan your next adventure!</div>
      <a href="create-trip.html" class="btn btn-primary mt-xl">Plan New Trip</a>
    </div>
  </main>

  <div id="toast-container"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script>
    const user = Session.require();
    renderNavbar(user);

    const TRIP_IMAGES = [
      'https://images.unsplash.com/photo-1506929662133-570293363f78?auto=format&fit=crop&q=80&w=600',
      'https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&q=80&w=600',
      'https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&q=80&w=600',
      'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&q=80&w=600'
    ];

    function renderAll() {
      const query = document.getElementById('trip-search').value.toLowerCase();
      let trips = Trips.forUser(user.id);
      
      if (query) {
        trips = trips.filter(t => t.name.toLowerCase().includes(query) || (t.description||'').toLowerCase().includes(query));
      }

      const ongoing  = trips.filter(t => tripStatus(t.startDate, t.endDate) === 'ongoing');
      const upcoming = trips.filter(t => tripStatus(t.startDate, t.endDate) === 'upcoming');
      const past     = trips.filter(t => tripStatus(t.startDate, t.endDate) === 'past');

      const onGrid   = document.getElementById('ongoing-grid');
      const upGrid   = document.getElementById('upcoming-grid');
      const paList   = document.getElementById('past-list');
      const empty    = document.getElementById('empty-state');

      // Ongoing
      if (ongoing.length === 0) {
        document.getElementById('section-ongoing').style.display = 'none';
      } else {
        document.getElementById('section-ongoing').style.display = 'block';
        onGrid.innerHTML = ongoing.map(t => {
          const stops = Stops.forTrip(t.id);
          const dayCount = daysBetween(t.startDate, t.endDate);
          const currentDay = Math.min(dayCount, daysBetween(t.startDate, new Date().toISOString().split('T')[0]) + 1);
          const pct = Math.round((currentDay / dayCount) * 100);
          return `
            <div class="ongoing-card animate-in">
              <img src="${TRIP_IMAGES[0]}" class="ongoing-img" />
              <div class="ongoing-content">
                <div class="flex justify-between items-start mb-md">
                  <span class="badge badge-accent">Day ${currentDay} of ${dayCount}</span>
                  <button class="btn btn-icon btn-ghost" onclick="showToast('More options...','info')">
                    <span class="material-symbols-outlined">more_vert</span>
                  </button>
                </div>
                <h3 class="h3 mb-xs">${t.name}</h3>
                <p class="body-sm text-muted mb-lg flex items-center gap-xs">
                  <span class="material-symbols-outlined" style="font-size:16px;">location_on</span>
                  ${stops.map(s => s.cityName).join(' • ') || 'No stops added'}
                </p>
                <div class="mt-auto">
                  <div class="flex justify-between label-sm mb-xs">
                    <span class="text-muted">Progress</span>
                    <span>${pct}%</span>
                  </div>
                  <div class="progress-bar-wrap" style="height:6px;">
                    <div class="progress-bar-fill accent" style="width:${pct}%"></div>
                  </div>
                  <div class="flex justify-between items-center mt-xl">
                    <div class="flex -space-x-2">
                       <div class="avatar avatar-sm border-2" style="background:var(--grad-primary);">AR</div>
                       <div class="avatar avatar-sm border-2" style="background:var(--grad-accent);">SJ</div>
                    </div>
                    <a href="itinerary.html?trip=${t.id}" class="btn btn-primary btn-sm">Manage Journey →</a>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      // Upcoming
      if (upcoming.length === 0) {
        document.getElementById('section-upcoming').style.display = 'none';
      } else {
        document.getElementById('section-upcoming').style.display = 'block';
        upGrid.innerHTML = upcoming.map((t, i) => {
          const daysTo = daysBetween(new Date().toISOString().split('T')[0], t.startDate);
          return `
            <div class="trip-card animate-in" style="animation-delay:${i*100}ms">
              <img src="${TRIP_IMAGES[(i+1)%4]}" class="trip-card-image" />
              <div class="trip-card-body">
                <div class="flex justify-between items-start mb-sm">
                  <span class="badge badge-primary">In ${daysTo} Days</span>
                  <span class="material-symbols-outlined text-muted cursor-pointer hover:text-accent transition-all">favorite</span>
                </div>
                <h3 class="trip-card-name">${t.name}</h3>
                <p class="body-xs text-muted mb-lg flex items-center gap-xs">
                  <span class="material-symbols-outlined" style="font-size:16px;">calendar_today</span>
                  ${formatDate(t.startDate, {month:'short', day:'numeric'})} — ${formatDate(t.endDate, {month:'short', day:'numeric', year:'numeric'})}
                </p>
                <div class="flex justify-between items-center pt-md border-t" style="border-color:var(--border);">
                  <div class="flex items-center gap-xs body-xs text-muted">
                    <span class="material-symbols-outlined" style="font-size:16px;">flight</span>
                    <span>Flights Booked</span>
                  </div>
                  <a href="itinerary.html?trip=${t.id}" class="btn btn-ghost btn-sm">Details</a>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      // Past
      if (past.length === 0) {
        document.getElementById('section-past').style.display = 'none';
      } else {
        document.getElementById('section-past').style.display = 'block';
        paList.innerHTML = past.map(t => {
          const acts = Stops.forTrip(t.id).reduce((acc, s) => acc + Activities.forStop(s.id).length, 0);
          return `
            <div class="trip-list-item animate-in">
              <div class="flex items-center gap-lg flex-1">
                <img src="${TRIP_IMAGES[3]}" class="trip-list-img" />
                <div>
                  <h4 class="h4" style="margin:0;">${t.name}</h4>
                  <p class="body-xs text-muted">${formatDate(t.startDate, {month:'long', year:'numeric'})} • ${acts} Activities</p>
                </div>
              </div>
              <div class="flex items-center gap-2xl">
                <div class="text-right hidden md:block">
                  <div class="label-sm text-muted">Budget Spent</div>
                  <div class="body-md font-bold">${formatCurrency(Math.random()*2000 + 1000)}</div>
                </div>
                <div class="flex gap-sm">
                   <button class="btn btn-icon btn-ghost" onclick="showToast('Shared!','success')"><span class="material-symbols-outlined">share</span></button>
                   <button class="btn btn-icon btn-ghost"><span class="material-symbols-outlined">download</span></button>
                   <a href="itinerary.html?trip=${t.id}" class="btn btn-icon btn-ghost"><span class="material-symbols-outlined">replay</span></a>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      empty.style.display = (trips.length === 0) ? 'flex' : 'none';
    }

    renderAll();
  </script>
  <script src="js/gsap-3d.js"></script>
</body>
</html>
